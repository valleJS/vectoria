# Local backing services for development: `npm run services:up`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vectoria
      POSTGRES_PASSWORD: vectoria
      POSTGRES_DB: vectoria
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vectoria']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
