# Lives on the server as /opt/vectoria/compose.yml (see docs/DEPLOYMENT.md).
# IMAGE_TAG and PROXY_NETWORK come from /opt/vectoria/.env; game settings from vectoria.env.
services:
  vectoria:
    image: ghcr.io/vallejs/vectoria:${IMAGE_TAG:-latest}
    container_name: vectoria
    restart: unless-stopped
    env_file: vectoria.env
    volumes:
      - ./data:/data
      # Read-only for the admin panel's outpost-level replay (BACKUP_DIR).
      - ./backups:/backups:ro
    # No published ports: Nginx Proxy Manager reaches it as http://vectoria:3001.
    networks:
      - proxy
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
