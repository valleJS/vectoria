name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/vallejs/vectoria

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SSH key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      # The deploy key is pinned to /opt/vectoria/deploy.sh on the server; the "command" is the tag.
      # sshd sometimes drops new connections (bot load, packet loss), so connecting is retried.
      # Exit 255 is ssh's own failure; any other code is deploy.sh's verdict and ends the job.
      # deploy.sh is safe to repeat for the same tag, should a dropped link interrupt it.
      - name: Roll out
        run: |
          for attempt in 1 2 3 4 5; do
            ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 \
              deploy@${{ secrets.DEPLOY_HOST }} "${{ github.sha }}" && exit 0
            code=$?
            [ "$code" -ne 255 ] && exit "$code"
            echo "SSH attempt $attempt failed, retrying in $((attempt * 15)) s"
            sleep $((attempt * 15))
          done
          exit 1
